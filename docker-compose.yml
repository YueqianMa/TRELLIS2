# ==============================================================================
# TRELLIS RunPod Serverless - Docker Compose for Local Development
# ==============================================================================
#
# Usage:
#   docker-compose build    # Build the image
#   docker-compose up       # Run the container
#   docker-compose down     # Stop the container
#
# Test with:
#   curl -X POST http://localhost:8000/runsync \
#     -H "Content-Type: application/json" \
#     -d @test_input.json
#
# ==============================================================================

version: "3.8"

services:
  trellis:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount model cache to avoid re-downloading
      - huggingface_cache:/root/.cache/huggingface
      # Mount local code for development (optional)
      # - ./trellis:/app/trellis
      # - ./rp_handler.py:/app/rp_handler.py
    environment:
      # Storage configuration
      - STORAGE_BACKEND=base64
      # Model configuration
      - PRELOAD_MODEL=true
      - ATTN_BACKEND=xformers
      - SPCONV_ALGO=native
      # Uncomment for S3 storage
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # - S3_BUCKET=${S3_BUCKET}
      # - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Run with local API server for testing
    command: ["python", "-u", "rp_handler.py", "--rp_serve_api", "--rp_api_host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  huggingface_cache:
    driver: local
